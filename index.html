<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ROMA SOUND FACTORY</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; display:flex; justify-content:center;
 font-family:Arial,"Segoe UI",sans-serif; color:#fff;
 background:radial-gradient(circle at 50% 10%,#252525 0,#0c0c0c 38%,#000 100%);
}
.wrap{width:min(460px,100%);padding:28px 18px 36px;text-align:center}
.card{
 background:rgba(18,18,18,.88); border:1px solid #2d2d2d;
 border-radius:28px; padding:26px 18px 22px;
 box-shadow:0 20px 70px rgba(0,0,0,.55); backdrop-filter:blur(8px);
}
.logo{width:150px;height:150px;object-fit:cover;border-radius:50%;border:4px solid #eee;box-shadow:0 0 0 4px #e11,0 12px 35px #000;margin:4px auto 18px}
h1{font-size:25px;letter-spacing:3px;margin:0 0 6px;font-weight:800}
.sub{color:#bbb;font-size:14px;margin:0 0 22px}
.links{display:grid;gap:12px}
a{
 display:flex;align-items:center;justify-content:center;gap:10px;
 min-height:56px;padding:0 18px;border-radius:16px;
 color:#fff;text-decoration:none;font-size:17px;font-weight:700;
 border:1px solid #333;background:#151515;
 transition:.18s transform,.18s background;
}
a:hover{transform:translateY(-2px);background:#202020}
.icon{width:27px;font-size:21px}
.tiktok{border-color:#444}.instagram{border-color:#444}.facebook{border-color:#444}.whatsapp{border-color:#444}
.footer{margin-top:22px;color:#777;font-size:12px;letter-spacing:1px}
.red{color:#e60000}
</style>
</head>
<body>
<div class="wrap">
 <main class="card">
  <img class="logo" src="logo.jpg" alt="ROMA SOUND FACTORY">
  <h1>ROMA SOUND FACTORY</h1>
  <p class="sub">NEVER BE CALM</p>

  <div class="links">
   <a class="tiktok" href="https://www.tiktok.com/@reham.mahmoud666" target="_blank" rel="noopener"><span class="icon">♪</span>TikTok</a>
   <a class="instagram" href="https://www.instagram.com/romasoundfactory" target="_blank" rel="noopener"><span class="icon">◎</span>Instagram</a>
   <a class="facebook" href="https://www.facebook.com/share/1EfpTcCgEH/" target="_blank" rel="noopener"><span class="icon">f</span>Facebook</a>
   <a class="whatsapp" href="https://wa.me/201159045548" target="_blank" rel="noopener"><span class="icon">◉</span>WhatsApp</a>
  </div>

  <div class="footer">ROMA SOUND FACTORY <span class="red">●</span> NEVER BE CALM</div>
 </main>
</div>
</body>
</html>
